# The Fly app name and region are intentionally not embedded in source.
# Create the app with `fly launch --no-deploy`, then deploy with `fly deploy -a $HARBOR_FLY_APP`.

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "uvicorn harbor.control_plane:app --host 0.0.0.0 --port 8080"
  scheduler = "python -m harbor.scheduler"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["scheduler"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"
