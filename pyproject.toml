[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-ai-worker-runtime"
version = "0.9.0a0"
description = "Multi-tenant AI worker platform with Fly.io Sprites execution."
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
production = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "httpx>=0.27,<1", "sprites-py>=0.6,<0.7", "mcp>=2.1,<3"]
mcp = ["mcp>=2.1,<3"]
slack = ["flask", "slack-bolt", "slack-sdk"]
test = ["pytest>=8", "psycopg[binary]>=3.2", "httpx>=0.27", "sprites-py>=0.6,<0.7"]

[project.scripts]
harbor = "harbor.cli:main"

[tool.setuptools.packages.find]
include = ["harbor", "harbor.*"]

[tool.pytest.ini_options]
markers = [
    "postgres: requires TEST_DATABASE_URL pointing to an isolated Postgres database",
]
