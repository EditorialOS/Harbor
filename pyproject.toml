[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-ai-worker-runtime"
version = "0.9.0a0"
description = "Multi-tenant AI worker platform with Fly.io Sprites execution."
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
production = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "sprites-py"]
mcp = ["mcp"]
slack = ["flask", "slack-bolt", "slack-sdk"]

[project.scripts]
harbor = "harbor.cli:main"
